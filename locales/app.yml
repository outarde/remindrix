    - `%{hoy}`, `%{mañana}`
    ###### 🕐 Hora
    - `20:03`, `20.03`, `a las 20:03`
    - `%{mañana}`, `%{tarde}`, `%{noche}`
    - Si no especificas la hora, el recordatorio llegará a las `09:00`
    ###### ⚙️ Comandos
    - coloque `/` o `!` antes de un comando
    - `%{cmd_list}|%{cmd_local}` - crea un recordatorio
    - `%{cmd_tz_list} Europe/Paris` - establece la zona horaria
    - `%{cmd_list}|%{cmd_local} --help` - imprimir ayuda para el modo Pro (solo en inglés)
  sv: |
    Jag är en påminnelsebot. Skicka mig datum, tid och påminnelsetext på samma rad. Till exempel: `%{date} 20:03 din påminnelse`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Tid
    - `20:03`, `20.03`, `mig 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - om du inte anger tiden kommer påminnelsen klockan `09:00`
    ###### ⚙️ Kommandon
    - Skriv `/` eller `!` i början
    - `%{cmd_list}|%{cmd_local}` - skapa en påminnelse
    - `%{cmd_tz_list} Europe/Paris` - ställ in tidszonen
    - `%{cmd_list}|%{cmd_local} --help` - skriv ut hjälp för Pro-läget (endast på engelska)
  pl: |
    Jestem botem przypominającym. Wyślij mi datę, godzinę i tekst przypomnienia w jednym wierszu. Na przykład: `%{date} 20:03 twoje przypomnienie`.

    ###### 📅 Data
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Godzina
    - `20:03`, `20.03`, `o 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - jeśli nie podasz godziny, przypomnienie pojawi się o `09:00`
    ###### ⚙️ Polecenia
    - Wpisz `/` lub `!` na początku
    - `%{cmd_list}|%{cmd_local}` - utwórz przypomnienie
    - `%{cmd_tz_list} Europe/Paris` - ustaw strefę czasową
    - `%{cmd_list}|%{cmd_local} --help` - wyświetl pomoc dla trybu Pro (tylko w języku angielskim)
  cs: |
    Jsem bot pro připomenutí. Pošlete mi datum, čas a text připomenutí na stejném řádku. Například: `%{date} 20:03 vaše připomenutí`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Čas
    - `20:03`, `20.03`, `v 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - pokud nezadáte čas, připomenutí se zobrazí v `09:00`
    ###### ⚙️ Příkazy
    - Na začátek vložte `/` nebo `!`
    - `%{cmd_list}|%{cmd_local}` - vytvoří připomenutí
    - `%{cmd_tz_list} Europe/Paris` - nastaví časové pásmo
    - `%{cmd_list}|%{cmd_local} --help` - zobrazit nápovědu pro režim Pro (pouze v angličtině)
  fi: |
    Olen muistutusbotti. Lähetä minulle päivämäärä, aika ja muistutusteksti samalla rivillä. Esimerkiksi: `%{date} 20:03 muistutuksesi`.

    ##### 📅 Päivämäärä
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Aika
    - `20:03`, `20.03`, `kello 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - jos et määritä aikaa, muistutus tulee klo `09:00`
    ###### ⚙️ Komennot
    - Laita `/` tai `!` komentojen eteen
    - `%{cmd_list}|%{cmd_local}` - luo muistutus
    - `%{cmd_tz_list} Europe/Paris` - aseta aikavyöhyke
    - `%{cmd_list}|%{cmd_local} --help` - tulosta Pro-tilan ohje (vain englanniksi)
  ja: |
    私はリマインダーボットです。日付、時刻、リマインダーのテキストを同じ行で送信してください。例：`%{date} 20:03 あなたのリマインダー`。

    ###### 📅 日付
    - `%{date}`、`%{date_slash}`、`%{date_hyphen}`
    - `%{date_d} %{month}`、`%{date_d} %{month_truncated}`
    - `%{today}`、`%{tomorrow}`
    ###### 🕐 時刻
    - `20:03`, `20.03`
    - `%{morning}`、`%{afternoon}`、`%{evening}`
    - 時刻を指定しない場合、リマインダーは`09:00`に送信されます
    ###### ⚙️ コマンド
    - コマンドの前に `/` または `!` を置きます
    - `%{cmd_list}|%{cmd_local}` - リマインダーを作成します
    - `%{cmd_tz_list} Europe/Paris` - タイムゾーンを設定します
    - `%{cmd_list}|%{cmd_local} --help` - Proモードのヘルプを表示する（英語のみ）
  zh: |
    我是提醒机器人。请将日期、时间和提醒文本写在同一行。例如：`%{date} 20:03 您的提醒`。

    ###### 📅 日期
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`

    ###### 🕐 时间
    - `20:03`, `20.03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - 如果您未指定时间，提醒将在 `09:00` 发送
    ###### ⚙️ 命令
    - 在命令前放置 `/` 或 `!`
    - `%{cmd_list}|%{cmd_local}` - 创建提醒
    - `%{cmd_tz_list} Europe/Paris` - 设置时区
    - `%{cmd_list}|%{cmd_local} --help` - 打印专业模式的帮助信息（仅限英文）
  ru: |
    Я бот-напоминалка. Отправьте мне дату, время и текст напоминания в той же строке. Например: `%{date} 14:00 ваше напоминание`.
    
    ###### 📅 Дата
      - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
      - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
      - `%{today}`, `%{tomorrow}`
    ###### 🕐 Время
      - `20:03`, `20.03`, `в 20:03`
      - `%{morning}`, `%{afternoon}`, `%{evening}`
      - если вы не укажете время, напоминание придет в `09:00`
      ###### ⚙️ Команды
      - Поставьте `/` или `!` в начале
      - `%{cmd_list}|%{cmd_local}` - тоже создать напоминание
      - `%{cmd_tz_list} Europe/Paris` - установить часовой пояс
      - `%{cmd_list}|%{cmd_local} --help` - показать справку по Pro-режиму (только на английском языке)
  uk: |
    Я бот-нагадування. Надішліть: дату, час і текст нагадування в одному рядку. Наприклад: `%{date} 20:03 ваше нагадування`.

    ###### 📅 Дата
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Час
    - `20:03`, `20.03`, `о 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - якщо не вказати час, нагадування надійде о `09:00`
    ###### ⚙️ Команди
    - ставте `/` або `!` перед командою
    - `%{cmd_list}|%{cmd_local}` - теж створити нагадування
    - `%{cmd_tz_list} Europe/Paris` - встановити часовий пояс
    - `%{cmd_list}|%{cmd_local} --help` - вивести довідку для режиму Pro (лише англійською мовою)
