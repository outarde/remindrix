    - `20:03`, `20.03`, `alle 20:03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - Se non specifichi l'ora, il promemoria arriverà alle `%{default_time}`
    ###### 🪄 Comandi: inserisci `/` o `!` prima di un comando
    - `%{cmd_list}` - crea un promemoria
    - `%{cmd_list} --help` - stampa la guida per la modalità Pro (solo in inglese)
    - `%{cmd_set_list}` - impostazioni, incluso il fuso orario
    - `%{cmd_list_list}` - elenco dei promemoria
  es: |
    Soy un bot de recordatorios. Envíame la fecha, la hora y el texto del recordatorio en la misma línea. Por ejemplo: `%{fecha} 20:03 tu recordatorio`.

    ###### 📅 Fecha
    - `%{fecha}`, `%{fecha_barra}`, `%{fecha_guion}`
    - `%{fecha_d} %{mes}`, `%{fecha_d} %{mes_truncado}`
    - `%{hoy}`, `%{mañana}`
    ###### 🕐 Hora
    - `20:03`, `20.03`, `a las 20:03`, `8 p.m.`
    - `%{mañana}`, `%{tarde}`, `%{noche}`
    - Si no especificas la hora, el recordatorio llegará a las `%{default_time}`
    ###### 🪄 Comandos
    - coloque `/` o `!` antes de un comando
    - `%{cmd_list}` - crea un recordatorio
    - `%{cmd_list} --help` - imprimir ayuda para el modo Pro (solo en inglés)
    - `%{cmd_set_list}` - configuración, incluida la zona horaria
    - `%{cmd_list_list}` - lista de recordatorios
  sv: |
    Jag är en påminnelsebot. Skicka mig datum, tid och påminnelsetext på samma rad. Till exempel: `%{date} 20:03 din påminnelse`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Tid
    - `20:03`, `20.03`, `mig 20:03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - om du inte anger tiden kommer påminnelsen klockan `%{default_time}`
    ###### 🪄 Kommandon
    - Skriv `/` eller `!` i början
    - `%{cmd_list}` - skapa en påminnelse
    - `%{cmd_list} --help` - skriv ut hjälp för Pro-läget (endast på engelska)
    - `%{cmd_set_list}` - inställningar, inklusive tidszon
    - `%{cmd_list_list}` - lista över påminnelser
  pl: |
    Jestem botem przypominającym. Wyślij mi datę, godzinę i tekst przypomnienia w jednym wierszu. Na przykład: `%{date} 20:03 twoje przypomnienie`.

    ###### 📅 Data
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Godzina
    - `20:03`, `20.03`, `o 20:03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - jeśli nie podasz godziny, przypomnienie pojawi się o `%{default_time}`
    ###### 🪄 Polecenia
    - Wpisz `/` lub `!` na początku
    - `%{cmd_list}` - utwórz przypomnienie
    - `%{cmd_list} --help` - wyświetl pomoc dla trybu Pro (tylko w języku angielskim)
    - `%{cmd_set_list}` - ustawienia, w tym strefa czasowa
    - `%{cmd_list_list}` - lista przypomnień
  cs: |
    Jsem bot pro připomenutí. Pošlete mi datum, čas a text připomenutí na stejném řádku. Například: `%{date} 20:03 vaše připomenutí`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Čas
    - `20:03`, `20.03`, `v 20:03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - pokud nezadáte čas, připomenutí se zobrazí v `%{default_time}`
    ###### 🪄 Příkazy
    - Na začátek vložte `/` nebo `!`
    - `%{cmd_list}` - vytvoří připomenutí
    - `%{cmd_list} --help` - zobrazit nápovědu pro režim Pro (pouze v angličtině)
    - `%{cmd_set_list}` - nastavení včetně časového pásma
    - `%{cmd_list_list}` - seznam připomínek
  fi: |
    Olen muistutusbotti. Lähetä minulle päivämäärä, aika ja muistutusteksti samalla rivillä. Esimerkiksi: `%{date} 20:03 muistutuksesi`.

    ##### 📅 Päivämäärä
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Aika
    - `20:03`, `20.03`, `kello 20:03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - jos et määritä aikaa, muistutus tulee klo `%{default_time}`
    ###### 🪄 Komennot
    - Laita `/` tai `!` komentojen eteen
    - `%{cmd_list}` - luo muistutus
    - `%{cmd_list} --help` - tulosta Pro-tilan ohje (vain englanniksi)
    - `%{cmd_set_list}` - asetukset, mukaan lukien aikavyöhyke
    - `%{cmd_list_list}` - muistutusluettelo
  ja: |
    私はリマインダーボットです。日付、時刻、リマインダーのテキストを同じ行で送信してください。例：`%{date} 20:03 あなたのリマインダー`。

    ###### 📅 日付
    - `%{date}`、`%{date_slash}`、`%{date_hyphen}`
    - `%{date_d} %{month}`、`%{date_d} %{month_truncated}`
    - `%{today}`、`%{tomorrow}`
    ###### 🕐 時刻
    - `20:03`, `20.03`, `8 p.m.`
    - `%{morning}`、`%{afternoon}`、`%{evening}`
    - 時刻を指定しない場合、リマインダーは`%{default_time}`に送信されます
    ###### 🪄 コマンド
    - コマンドの前に `/` または `!` を置きます
    - `%{cmd_list}` - リマインダーを作成します
    - `%{cmd_list} --help` - Proモードのヘルプを表示する（英語のみ）
    - `%{cmd_set_list}` - タイムゾーンを含むボット設定
    - `%{cmd_list_list}` - リマインダー一覧
  zh: |
    我是提醒机器人。请将日期、时间和提醒文本写在同一行。例如：`%{date} 20:03 您的提醒`。

    ###### 📅 日期
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`

    ###### 🕐 时间
    - `20:03`, `20.03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - 如果您未指定时间，提醒将在 `%{default_time}` 发送
    ###### 🪄 命令
    - 在命令前放置 `/` 或 `!`
    - `%{cmd_list}` - 创建提醒
    - `%{cmd_list} --help` - 打印专业模式的帮助信息（仅限英文）
    - `%{cmd_set_list}` - 机器人设置，包括时区
    - `%{cmd_list_list}` - 提醒列表
  ru: |
    Я бот-напоминалка. Отправьте мне дату, время и текст напоминания в той же строке. Например: `%{date} 14:00 ваше напоминание`.
    
    ###### 📅 Дата
      - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
      - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
      - `%{today}`, `%{tomorrow}`
    ###### 🕐 Время
      - `20:03`, `20.03`, `в 20:03`, `8 p.m.`
      - `%{morning}`, `%{afternoon}`, `%{evening}`
      - если вы не укажете время, напоминание придет в `%{default_time}`
      ###### 🪄 Команды
      - Поставьте `/` или `!` в начале
      - `%{cmd_list}` - тоже создать напоминание
      - `%{cmd_list} --help` - показать справку по Pro-режиму (только на английском языке)
      - `%{cmd_set_list}` - настройки, включая часовой пояс
      - `%{cmd_list_list}` - список напоминаний
  uk: |
    Я бот-нагадування. Надішліть: дату, час і текст нагадування в одному рядку. Наприклад: `%{date} 20:03 ваше нагадування`.

    ###### 📅 Дата
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Час
    - `20:03`, `20.03`, `о 20:03`, `8 p.m.`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - якщо не вказати час, нагадування надійде о `%{default_time}`
    ###### 🪄 Команди
    - ставте `/` або `!` перед командою
    - `%{cmd_list}` - теж створити нагадування
    - `%{cmd_list} --help` - вивести довідку для режиму Pro (лише англійською мовою)
    - `%{cmd_set_list}` - налаштування бота, зокрема часовий пояс
    - `%{cmd_list_list}` - список нагадувань
