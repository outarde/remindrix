settings.default-times:
  en: |
    Here are the times used when you type:
    - 🌅 `%{morning}` - morning
    - ☀️ `%{afternoon}` - afternoon
    - 🌃 `%{evening}` - evening
    - `%{default}` - without a specific time (same day or next day)

    To change the time: 
    - Specify its type: `morning|afternoon|evening|default`. 
    - Then the time separated by a colon: `09:00`, `21:00`. 
    - For example: `/%{cmd} time --evening 22:30`.
  de: |
    Hier sind die Zeiten, die Sie bei der Eingabe verwenden: 
    - 🌅 `%{morning}` – Morgen 
    - ☀️ `%{afternoon}` – Nachmittag 
    - 🌃 `%{evening}` – Abend 
    - `%{default}` – ohne bestimmte Uhrzeit (gleicher Tag oder nächster Tag) 

    So ändern Sie die Uhrzeit: 
    - Geben Sie den Typ an: `default|morning|afternoon|evening`. 
    - Dann die durch einen Doppelpunkt getrennte Uhrzeit: `09:00`, `21:00`. 
    - Zum Beispiel: `/%{cmd} time --evening 22:30`.
  fr: |
    Voici les moments utilisés lors de la saisie :
    - 🌅 `%{morning}` - matin
    - ☀️ `%{afternoon}` - après-midi
    - 🌃 `%{evening}` - soir
    - `%{default}` - sans moment précis (le jour même ou le lendemain)

    Pour modifier l'heure :
    - Indiquez le type : `default|morning|afternoon|evening`. 
    - Puis l'heure, séparée par deux-points : `09:00`, `21:00`. 
    - Par exemple : `/%{cmd} time --evening 22:30`.
  it: |
    Ecco gli orari utilizzati quando digiti:
    - 🌅 `%{morning}` - mattina
    - ☀️ `%{afternoon}` - pomeriggio
    - 🌃 `%{evening}` - sera
    - `%{default}` - senza un orario specifico (stesso giorno o giorno successivo)

    Per modificare l'orario:
    - Specifica il tipo: `default|morning|afternoon|evening`. 
    - Poi l'orario separato da due punti: `09:00`, `21:00`. 
    - Ad esempio: `/%{cmd} time --evening 22:30`.
  es: |
    Estos son los momentos que se utilizan al escribir:
    - 🌅 `%{morning}` - mañana
    - ☀️ `%{afternoon}` - tarde
    - 🌃 `%{evening}` - noche
    - `%{default}` - sin un momento específico (mismo día o día siguiente)

    Para cambiar el momento:
    - Especifica el tipo: `default|morning|afternoon|evening`. 
    - Luego, la hora separada por dos puntos: `09:00`, `21:00`. 
    - Por ejemplo: `/%{cmd} time --evening 22:30`.
  sv: |
    Här är tidsalternativen som används när du skriver:
    - 🌅 `%{morning}` – morgon
    - ☀️ `%{afternoon}` – eftermiddag
    - 🌃 `%{evening}` – kväll
    - `%{default}` – utan specifik tid (samma dag eller nästa dag)

    För att ändra tiden:
    - Ange typen: `default|morning|afternoon|evening`. 
    - Ange sedan tiden, separerad med ett kolon: `09:00`, `21:00`. 
    - Exempel: `/%{cmd} time --evening 22:30`.
  pl: |
    Oto oznaczenia pór dnia używane przy wpisywaniu komendy:
    - 🌅 `%{morning}` – rano
    - ☀️ `%{afternoon}` – popołudnie
    - 🌃 `%{evening}` – wieczór
    - `%{default}` – bez konkretnej pory (ten sam lub następny dzień)

    Aby zmienić godzinę:
    - Określ typ pory: `default|morning|afternoon|evening`. 
    - Następnie podaj godzinę oddzieloną dwukropkiem: `09:00`, `21:00`. 
    - Przykład: `/%{cmd} time --evening 22:30`.
  cs: |
    Zde jsou časy používané při psaní:
    - 🌅 `%{morning}` – ráno
    - ☀️ `%{afternoon}` – odpoledne
    - 🌃 `%{evening}` – večer
    - `%{default}` – bez konkrétního času (tentýž nebo následující den)

    Pro změnu času:
    - Uveďte jeho typ: `default|morning|afternoon|evening`. 
    - Poté zadejte čas oddělený dvojtečkou: `09:00`, `21:00`. 
    - Například: `/%{cmd} time --evening 22:30`.
  fi: |
    Tässä ovat käytettävät ajat:
    - 🌅 `%{morning}` – aamu
    - ☀️ `%{afternoon}` – iltapäivä
    - 🌃 `%{evening}` – ilta
    - `%{default}` – ilman tiettyä kellonaikaa (sama päivä tai seuraava päivä)

    Kellonajan muuttaminen:
    - Määritä tyyppi: `default|morning|afternoon|evening`. 
    - Lisää sen jälkeen kellonaika kaksoispisteellä erotettuna: `09:00`, `21:00`. 
    - Esimerkki: `/%{cmd} time --evening 22:30`.
  ja: |
    入力時に使用される時刻は以下の通りです：
    - 🌅 `%{morning}` - 午前
    - ☀️ `%{afternoon}` - 午後
    - 🌃 `%{evening}` - 夜間
    - `%{default}` - 特定の時刻指定なし（当日または翌日）

    時刻を変更する場合：
    - 種類（`default`、`morning`、`afternoon`、`evening`）を指定します。 
    - 続いて、コロンで区切って時刻（`09:00`、`21:00`など）を指定します。 
    - 例：`/%{cmd} time --evening 22:30`
  zh: |
    输入时使用的具体时间如下：
    - 🌅 `%{morning}` - 上午/早晨
    - ☀️ `%{afternoon}` - 下午
    - 🌃 `%{evening}` - 晚上
    - `%{default}` - 无特定时间（当天或次日）

    若要更改时间：
    - 指定类型：`default|morning|afternoon|evening`。 
    - 随后用冒号分隔时间：`09:00`、`21:00`。 
    - 例如：`/%{cmd} time --evening 22:30`。
  ru: |
    - 🌅 `%{morning}` - утро
    - 🌆 `%{afternoon}` - день
    - 🌃 `%{evening}` - вечер
    - `%{default}` - напоминания без времени (тот же или следующий день)

    Для изменения времени: 
    - Укажите его тип: `default|morning|afternoon|evening`.
    - Затем время через двоеточие: `09:00`, `21:00`.
    - Например: `/%{cmd} time --evening 22:30`.
  uk: |
    Ось типи часу, які можна використовувати під час введення:
    - 🌅 `%{morning}` — ранок
    - ☀️ `%{afternoon}` — день
    - 🌃 `%{evening}` — вечір
    - `%{default}` — без конкретного часу (той самий або наступний день)

    Щоб змінити час:
    - Вкажіть його тип: `default|morning|afternoon|evening`. 
    - Потім — час, відокремлений двокрапкою: `09:00`, `21:00`. 
    - Наприклад: `/%{cmd} time --evening 22:30`.
