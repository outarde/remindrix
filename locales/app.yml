settings.help:
  en: |
    Available subcommands:
    - `lang` - view the list of languages and change the one you are using.
    - `time` - view and change the default times for reminders.
  de: |
    Verfügbare Unterbefehle:
    - `lang` – Liste der Sprachen anzeigen und die aktuell verwendete Sprache ändern. 
    - `time` – Standardzeiten für Erinnerungen anzeigen und ändern.
  fr: |
    Sous-commandes disponibles :
    - `lang` - afficher la liste des langues et modifier celle que vous utilisez. 
    - `time` - afficher et modifier les horaires par défaut des rappels.
  it: |
    Sottocomandi disponibili:
    - `lang` - visualizza l'elenco delle lingue e cambia quella in uso. 
    - `time` - visualizza e modifica gli orari predefiniti per i promemoria.
  es: |
    Subcomandos disponibles:
    - `lang` - ver la lista de idiomas y cambiar el que estás utilizando. 
    - `time` - ver y cambiar los tiempos predeterminados para los recordatorios.
  sv: |
    Tillgängliga underkommandon:
    - `lang` – visa listan över språk och ändra det språk du använder. 
    - `time` – visa och ändra standardtiderna för påminnelser.
  pl: |
    Dostępne podpolecenia:
    - `lang` – wyświetl listę języków i zmień używany język. 
    - `time` – wyświetl i zmień domyślne pory przypomnień.
  cs: |
    Dostupné podpříkazy:
    - `lang` – zobrazení seznamu jazyků a změna aktuálně používaného jazyka. 
    - `time` – zobrazení a změna výchozích časů pro připomenutí.
  fi: |
    Käytettävissä olevat alikomennot:
    - `lang` – tarkastele kieliluetteloa ja vaihda käyttämääsi kieltä. 
    - `time` – tarkastele ja muuta muistutusten oletusaikoja.
  ja: |
    利用可能なサブコマンド:
    - `lang` - 言語の一覧を表示し、使用する言語を変更します。 
    - `time` - リマインダーのデフォルト時間を表示・変更します。
  zh: |
    可用的子命令：
    - `lang` - 查看语言列表并更改您正在使用的语言。 
    - `时间` - 查看和更改提醒的默认时间。
  ru: |
    Доступные подкоманды:
    - `lang` - изменение языка.
    - `time` - просмотр и изменение времени напоминаний.
  uk: |
    Доступні підкоманди:
    - `lang` — перегляд списку мов і зміна поточної мови. 
    - `time` — перегляд і зміна часу за замовчуванням для нагадувань.

settings.lang-list:
  en: |
    🇬🇧&nbsp;`en`, 🇩🇪 `de`, 🇫🇷 `fr`, 🇮🇹 `it`, 🇪🇸 `es`, 🇸🇪🛋️`sv`, 🇵🇱 `pl`, 🇨🇿 `cs`, 🇫🇮 `fi`, 🇯🇵 `ja`, 🇨🇳 `zh`, 🇷🇺 `ru`, 🇺🇦 `uk`.

settings.lang-help:
  en: |
    - Set the language using the command: `/%{cmd} lang <lang>`.
    - The bot will use the selected language for responses and for recognizing commands and the words within them.
    - For example, send `/%{cmd} lang fr` to set French language. Then the bot will create new reminders in response to the `/rappeler` command.
  de: |
    - Stellen Sie die Sprache mit dem Befehl ein: `/%{cmd} lang <lang>`. 
    - Der Bot verwendet die ausgewählte Sprache für Antworten und zum Erkennen von Befehlen und den darin enthaltenen Wörtern. 
    - Senden Sie beispielsweise `/%{cmd} lang en`, um die Englische Sprache festzulegen. Dann erstellt der Bot als Reaktion auf den Befehl `/remind` neue Erinnerungen.
  fr: |
    - Définissez la langue à l'aide de la commande : `/%{cmd} lang <lang>`. 
    - Le bot utilisera la langue sélectionnée pour ses réponses ainsi que pour reconnaître les commandes et les mots qu'elles contiennent. 
    - Par exemple, envoyez `/%{cmd} lang fr` pour choisir le français. Le bot créera alors de nouveaux rappels en réponse à la commande `/rappeler`.
  it: |
    - Imposta la lingua utilizzando il comando: `/%{cmd} lang <lang>`. 
    - Il bot utilizzerà la lingua selezionata per le risposte e per riconoscere i comandi e le parole in essi contenuti. 
    - Ad esempio, invia `/%{cmd} lang fr` per impostare la lingua francese. Il bot creerà quindi nuovi promemoria in risposta al comando `/rappeler`.
  es: |
    - Establece el idioma mediante el comando: `/%{cmd} lang <lang>`. 
    - El bot utilizará el idioma seleccionado para las respuestas y para reconocer los comandos y las palabras que contienen. 
    - Por ejemplo, envía `/%{cmd} lang fr` para establecer el idioma francés. A partir de ese momento, el bot creará nuevos recordatorios en respuesta al comando `/rappeler`.
  sv: |
    - Ställ in språket med kommandot: `/%{cmd} lang <lang>`. 
    - Boten använder det valda språket för svar samt för att känna igen kommandon och orden i dem. 
    - Skicka till exempel `/%{cmd} lang fr` för att välja franska. Boten kommer då att skapa nya påminnelser som svar på kommandot `/rappeler`.
  pl: |
    - Ustaw język za pomocą polecenia: `/%{cmd} lang <lang>`. 
    - Bot będzie używać wybranego języka do udzielania odpowiedzi oraz rozpoznawania poleceń i zawartych w nich słów. 
    - Na przykład wyślij `/%{cmd} lang fr`, aby ustawić język francuski. Wówczas bot będzie tworzył nowe przypomnienia w odpowiedzi na polecenie `/rappeler`.
  cs: |
    - Nastavte jazyk pomocí příkazu: `/%{cmd} lang <lang>`. 
    - Bot bude vybraný jazyk používat pro odpovědi i pro rozpoznávání příkazů a slov v nich obsažených. 
    - Například odešlete `/%{cmd} lang fr` pro nastavení francouzštiny. Bot poté bude vytvářet nová připomenutí v reakci na příkaz `/rappeler`.
  fi: |
    - Aseta kieli komennolla: `/%{cmd} lang <kieli>`. 
    - Botti käyttää valittua kieltä vastauksissaan sekä tunnistaessaan komentoja ja niiden sisältämiä sanoja. 
    - Aseta esimerkiksi ranska lähettämällä komento `/%{cmd} lang fr`. Tällöin botti luo uusia muistutuksia vastauksena `/rappeler`-komentoon.
  ja: |
    - `/%{cmd} lang <lang>` コマンドを使用して言語を設定します。 
    - ボットは、応答やコマンドおよびその中の単語の認識に、選択された言語を使用します。 
    - 例えば、`/%{cmd} lang fr` を送信するとフランス語が設定されます。その後、ボットは `/rappeler` コマンドに対して新しいリマインダーを作成するようになります。
  zh: |
    - 使用命令 `/%{cmd} lang <lang>` 设置语言。 
    - 机器人将使用所选语言进行回复，并识别命令及其包含的词汇。 
    - 例如，发送 `/%{cmd} lang fr` 即可将语言设置为法语。此后，机器人将响应 `/rappeler` 命令来创建新的提醒。
  ru: |
    - Установите язык командой: `/%{cmd} lang <язык>`, где `<язык>` - код языка из списка выше.
    - Напоминалка будет использовать выбранный язык для ответов и для распознавания команд (`напомни`, `завтра`).
    - Например, отправьте `/%{cmd} lang fr` для установки французского языка. Теперь бот будет создавать напоминания по французской команде `/rappeler`.
  uk: |
    - Встановіть мову за допомогою команди: `/%{cmd} lang <lang>`. 
    - Бот використовуватиме вибрану мову для відповідей, а також для розпізнавання команд і слів у них. 
    - Наприклад, надішліть `/%{cmd} lang fr`, щоб встановити французьку мову. Після цього бот створюватиме нові нагадування у відповідь на команду `/rappeler`.
