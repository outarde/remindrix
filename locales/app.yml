_version: 2
welcome:
  en: >
    I'm a reminder bot. Send me a reminder in this format: 
    `/remind %{date} [at] 15:30 <reminder text>`. You can replace the month number with its name,
    use words `today` or `tomorrow`. If no time was specified the reminder will arrive at 09:00.
    I'll send it to you in a shared or private chat.
  de: >
    Ich bin ein Erinnerungs-Bot. Sende mir eine Erinnerung in diesem Format: 
    `/remind %{date} 15:30 <Erinnerungstext>`. 
    Du kannst die Monatsnummer durch den Monatsnamen ersetzen.
    Verwende Wörter wie „heute“ oder „morgen“. Wenn keine Uhrzeit angegeben wurde, 
    kommt die Erinnerung um 9:00 Uhr. Ich sende sie dir in einem gemeinsamen oder privaten Chat.
  fr: >
    Je suis un bot de rappels. Envoyez-moi un rappel au format suivant: 
    `/remind %{date} 15:30 <texte du rappel>`. Vous pouvez remplacer le numéro du mois par son nom,
    et utiliser les mots «aujourd'hui» ou «demain». Si aucune heure n'est précisée, le rappel sera envoyé à 9h00. 
    Je vous l'enverrai dans une conversation partagée ou privée.
  it: >
    Sono un bot per i promemoria. Inviami un promemoria in questo formato: 
    `/remind %{date} 15:30 <testo del promemoria>`. 
    Puoi sostituire il numero del mese con il suo nome, usare le parole "oggi" o "domani". 
    Se non viene specificato un orario, il promemoria arriverà alle 09:00. 
    Te lo invierò in una chat condivisa o privata.
  es: >
    Soy un bot de recordatorios. Envíame un recordatorio con este formato: 
    `/remind %{date} 15:30 <texto del recordatorio>`. 
    Puedes reemplazar el número del mes por su nombre, usar las palabras "hoy" o "mañana". 
    Si no se especifica la hora, el recordatorio llegará a las 09:00. 
    Te lo enviaré en un chat compartido o privado.
  sv: >
    Jag är en påminnelsebot. Skicka mig en påminnelse i det här formatet: `/remind %{date} 15:30 <påminnelsetext>`. Du kan ersätta månadsnumret med dess namn, använda orden "idag" eller "imorgon". Om ingen tid har angetts kommer påminnelsen klockan 09:00. Jag skickar den till dig i en delad eller privat chatt.
  pl: >
    Jestem botem przypominającym. Wyślij mi przypomnienie w tym formacie: `/remind %{date} 15:30 <treść przypomnienia>`. Możesz zastąpić numer miesiąca jego nazwą, używając słów „dzisiaj” lub „jutro”. Jeśli nie podano godziny, przypomnienie pojawi się o 09:00. Wyślę Ci je na czacie współdzielonym lub prywatnym.
  cs: >
    Jsem bot pro připomenutí. Pošlete mi připomenutí v tomto formátu: `/remind %{date} 15:30 <text připomenutí>`. Číslo měsíce můžete nahradit jeho názvem, použít slova „dnes“ nebo „zítra“. Pokud nebyl zadán žádný čas, připomenutí dorazí v 9:00. Pošlu vám ho ve sdíleném nebo soukromém chatu.
  fi: >
    Olen muistutusbotti. Lähetä minulle muistutus tässä muodossa: `/remind %{date} [at] 15:30 <muistutuksen teksti>`. Voit korvata kuukauden numeron sen nimellä tai käyttää sanoja "tänään" tai "huomenna". Jos aikaa ei ole määritetty, muistutus saapuu klo 09:00. Lähetän sen sinulle jaetussa tai yksityisessä chatissa.
  ja: >
    私はリマインダーボットです。リマインダーは「/remind %{date} 15:30 <リマインダーテキスト>」という形式で送信してください。月の番号は月の名前に置き換えたり、「今日」や「明日」などの単語を使用したりできます。時間が指定されていない場合は、午前9時にリマインダーが届きます。共有チャットまたはプライベートチャットで送信します。
  zh: >
    我是一个提醒机器人。请按以下格式发送提醒：`/remind %{date} 15:30 <提醒内容>`。您可以将月份数字替换为月份名称，也可以使用“今天”或“明天”等词语。如果没有指定时间，提醒将在 09:00 发送。我会通过公共聊天或私聊发送给您。
  ru: >
    Я — бот-напоминалка. Отправьте мне напоминание в формате: 
    `/напомни %{date} [в] 15:30 <текст напоминания>`. Вы можете заменить число месяца его названием,
    дату — на слова `сегодня` или `завтра` и не указывать время — тогда напоминание придет в 09:00.
    Я отправлю вам его в общем или личном чате.
  uk: >
    Я – бот-нагадувач. Надішліть мені нагадування у форматі: 
    `/нагади %{date} [о] 15:30 <текст нагадування>`. Ви можете замінити число місяця його назвою, 
    дату - на слова "сьогодні" або "завтра" і не вказувати час - тоді нагадування прийде о 09:00. 
    Я надішлю вам його в загальному або особистому чаті.
welcome.on_command:
  en: |
    I am a reminder bot. Send: `/%{cmd_local}` and the date, time and reminder text on the same line. For example: `/%{cmd_local} %{date} 20:03 your reminder`.

    ###### 📅 Date 
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Time
    - `20:03`, `at 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - if you do not specify the time, the reminder will come at `09:00`
    ###### ⚙️ Commands
    - Put `/` or `!` at the beginning
    - `%{cmd_list}|%{cmd_local}` - create a reminder
    - `%{cmd_tz_list} Europe/Paris` - set the time zone
  de: |
    Ich bin ein Erinnerungs-Bot. Sende: `/%{cmd_local}` und Datum, Uhrzeit und Erinnerungstext in derselben Zeile. Zum Beispiel: `/%{cmd_local} %{date} 20:03 deine Erinnerung`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Uhrzeit
    - `20:03`, `um 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - Wenn du keine Uhrzeit angibst, erfolgt die Erinnerung um 9:00 Uhr
    ###### ⚙️ Befehle
    – Setzen Sie „/“ oder „!“ vor einen Befehl
    - `%{cmd_list}|%{cmd_local}`- eine Erinnerung erstellen
    - „%{cmd_tz_list} Europe/Paris“ – stellt die Zeitzone ein
  fr: |
    Je suis un bot de rappel. Envoyez: `/%{cmd_local}` suivi de la date, de l'heure et du texte du rappel sur la même ligne. Par exemple: `/%{cmd_local} %{date} 20:03 votre rappel`.

    ###### 📅 Date
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Heure
    - `20:03`, `à 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - Si vous ne spécifiez pas l'heure, le rappel sera envoyé à `09:00`
    ###### ⚙️ Commandes
    - Mettez `/` ou `!` avant une commande 
    - `%{cmd_list}|%{cmd_local}` - crée un rappel
    - `%{cmd_tz_list} Europe/Paris` - définit le fuseau horaire
  it: |
    Sono un bot per i promemoria. Invia: `/%{cmd_local}` seguito da data, ora e testo del promemoria sulla stessa riga. Ad esempio: `/%{cmd_local} %{date} 20:03 il tuo promemoria`.

    ###### 📅 Data
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ##### 🕐 Ora
    - `20:03`, `alle 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - Se non specifichi l'ora, il promemoria arriverà alle `09:00`
    ###### ⚙️ Comandi: inserisci `/` o `!` prima di un comando
    - `%{cmd_list}|%{cmd_local}` - crea un promemoria
    - `%{cmd_tz_list} Europe/Paris` - imposta il fuso orario
  es: |
    Soy un bot de recordatorios. Envía: `/%{cmd_local}` y la fecha, la hora y el texto del recordatorio en la misma línea. Por ejemplo: `/%{cmd_local} %{date} 20:03 tu recordatorio`.

    ###### 📅 Fecha
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Hora
    - `20:03`, `a las 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - Si no especificas la hora, el recordatorio llegará a las `09:00`
    ###### ⚙️ Comandos
    - coloque `/` o `!` antes de un comando
    - `%{cmd_list}|%{cmd_local}` - crea un recordatorio
    - `%{cmd_tz_list} Europe/Paris` - establece la zona horaria
  sv: |
    Jag är en påminnelsebot. Skicka: `/%{cmd_local}` och datum, tid och påminnelsetext på samma rad. Till exempel: `/%{cmd_local} %{date} 20:03 din påminnelse`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Tid
    - `20:03`, `mig 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - om du inte anger tiden kommer påminnelsen klockan `09:00`
    ###### ⚙️ Kommandon
    - Skriv `/` eller `!` i början
    - `%{cmd_list}|%{cmd_local}` - skapa en påminnelse
    - `%{cmd_tz_list} Europe/Paris` - ställ in tidszonen
  pl: |
    Jestem botem przypominającym. Wyślij: `/%{cmd_local}` oraz datę, godzinę i tekst przypomnienia w jednym wierszu. Na przykład: `/%{cmd_local} %{date} 20:03 Twoje przypomnienie`.

    ###### 📅 Data
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Godzina
    - `20:03`, `o 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - jeśli nie podasz godziny, przypomnienie pojawi się o `09:00`
    ###### ⚙️ Polecenia
    - Wpisz `/` lub `!` na początku
    - `%{cmd_list}|%{cmd_local}` - utwórz przypomnienie
    - `%{cmd_tz_list} Europe/Paris` - ustaw strefę czasową
  cs: |
    Jsem bot pro připomenutí. Pošlete: `/%{cmd_local}` a datum, čas a text připomenutí na stejný řádek. Například: `/%{cmd_local} %{date} 20:03 vaše připomenutí`.

    ###### 📅 Datum
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Čas
    - `20:03`, `v 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - pokud nezadáte čas, připomenutí se zobrazí v `09:00`
    ###### ⚙️ Příkazy
    - Na začátek vložte `/` nebo `!`
    - `%{cmd_list}|%{cmd_local}` - vytvoří připomenutí
    - `%{cmd_tz_list} Europe/Paris` - nastaví časové pásmo
  fi: |
    Olen muistutusbotti. Lähetä: `/%{cmd_local}` ja päivämäärä, kellonaika ja muistutuksen teksti samalla rivillä. Esimerkiksi: `/%{cmd_local} %{date} 20:03 muistutuksesi`.

    ###### 📅 Päivämäärä
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Aika
    - `20:03`, `kello 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - jos et määritä aikaa, muistutus tulee klo `09:00`
    ###### ⚙️ Komennot
    - Laita `/` tai `!` komentojen eteen
    - `%{cmd_list}|%{cmd_local}` - luo muistutus
    - `%{cmd_tz_list} Europe/Paris` - aseta aikavyöhyke
  ja: |
    私はリマインダーボットです。`/%{cmd_local}` と日付、時刻、リマインダーのテキストを同じ行に送信してください。例：`/%{cmd_local} %{date} 20:03 ゴジラの耳の後ろを掻いて`。

    ###### 📅 日付
    - `%{date}`、`%{date_slash}`、`%{date_hyphen}`
    - `%{date_d} %{month}`、`%{date_d} %{month_truncated}`
    - `%{today}`、`%{tomorrow}`
    ###### 🕐 時間
    - `20:03`
    - `%{morning}`、`%{afternoon}`、`%{evening}`
    - 時間を指定しない場合、リマインダーは`09:00`に送信されます
    ###### ⚙️ コマンド
    - コマンドの前に `/` または `!` を置きます
    - `%{cmd_list}|%{cmd_local}` - リマインダーを作成します
    - `%{cmd_tz_list} Europe/Paris` - タイムゾーンを設定します
  zh: |
    我是一个提醒机器人。发送：`/%{cmd_local}`，日期、时间和提醒文本写在同一行。例如：`/%{cmd_local} %{date} 20:03 您的提醒`。

    ###### 📅 日期
    - `%{date}`、`%{date_slash}`、`%{date_hyphen}`
    - `%{date_d} %{month}`、`%{date_d} %{month_truncated}`
    - `%{today}`、`%{tomorrow}`
    ###### 🕐 时间
    - `20:03`
    - `%{morning}`、`%{afternoon}`、`%{evening}`
    - 如果您未指定时间，提醒将在 `09:00` 发送
    ###### ⚙️ 命令
    - 在命令前放置 `/` 或 `!`
    - `%{cmd_list}|%{cmd_local}` - 创建提醒
    - `%{cmd_tz_list} Europe/Paris` - 设置时区
  ru: |
    Я бот-напоминалка. Напишите: `/%{cmd_local}` и дату, время и текст напоминания в той же строке. Например: `/%{cmd_local} %{date} 14:00 ваше напоминание`.
    
    ###### 📅 Дата
      - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
      - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
      - `%{today}`, `%{tomorrow}`
    ###### 🕐 Время
      - `20:03`, `в 20:03`
      - `%{morning}`, `%{afternoon}`, `%{evening}`
      - если вы не укажете время, напоминание придет в `09:00`
    ###### ⚙️ Команды
      - Поставьте `/` или `!` в начале
      - `%{cmd_list}|%{cmd_local}` - создать напоминание
      - `%{cmd_tz_list} Europe/Paris` - установить часовой пояс
  uk: |
    Я бот-нагадування. Надішліть: `/%{cmd_local}` та дату, час і текст нагадування в одному рядку. Наприклад: `/%{cmd_local} %{date} 20:03 ваше нагадування`.

    ###### 📅 Дата
    - `%{date}`, `%{date_slash}`, `%{date_hyphen}`
    - `%{date_d} %{month}`, `%{date_d} %{month_truncated}`
    - `%{today}`, `%{tomorrow}`
    ###### 🕐 Час
    - `20:03`, `о 20:03`
    - `%{morning}`, `%{afternoon}`, `%{evening}`
    - якщо не вказати час, нагадування надійде о `09:00`
    ###### ⚙️ Команди
    - ставте `/` або `!` перед командою
    - `%{cmd_list}|%{cmd_local}` - створити нагадування
    - `%{cmd_tz_list} Europe/Paris` - встановити часовий пояс
