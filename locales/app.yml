tz.current:
  en: >
    Room time zone is **%{tz}**. 
    To change it, specify the time zone in IANA format, for example: `/%{cmd_list} tz Europe/Paris`.
  de: >
    Die Zeitzone des Raumes ist **%{tz}**. 
    Um dies zu ändern, geben Sie die Zeitzone im IANA-Format an, zum Beispiel: `/%{cmd_list} tz Europe/London`.
  fr: >
    Le fuseau horaire de la chambre est **%{tz}**. 
    Pour le modifier, spécifiez le fuseau horaire au format IANA, par exemple : `/%{cmd_list} tz Europe/Athens`.
  it: >
    Il fuso orario della stanza è **%{tz}**. 
    Per modificarlo, specifica il fuso orario nel formato IANA, ad esempio: `/%{cmd_list} tz Europe/Paris`.
  es: >
    La zona horaria de la habitación es **%{tz}**. 
    Para cambiarla, especifique la zona horaria en formato IANA; por ejemplo: `/%{cmd_list} tz Europe/Paris`.
  sv: >
    Rummets tidszon är **%{tz}**. 
    För att ändra det anger du tidszonen i IANA-format, till exempel: `/%{cmd_list} tz Europe/Paris`.
  pl: >
    Strefa czasowa pokoju to **%{tz}**. 
    Aby to zmienić, określ strefę czasową w formacie IANA, na przykład: `/%{cmd_list} tz Europe/Paris`.
  cs: >
    Časové pásmo místnosti je **%{tz}**. 
    Chcete-li to změnit, zadejte časové pásmo ve formátu IANA, například: `/%{cmd_list} tz Europe/Paris`.
  fi: >
    Huoneen aikavyöhyke on **%{tz}**. 
    Voit muuttaa sitä määrittämällä aikavyöhykkeen IANA-muodossa, esimerkiksi: `/%{cmd_list} tz Europe/Paris`.
  ja: >
    部屋のタイムゾーンは**%{tz}**です。
    変更するには、IANA形式でタイムゾーンを指定します。例：`/%{cmd_list} tz Europe/Paris`
  zh: >
    房间时区为**%{tz}**。
    若要更改设置，请以 IANA 格式指定时区，例如：`/%{cmd_list} tz Europe/Paris`。
  ru: >
    Часовой пояс комнаты: **%{tz}**. 
    Для изменения укажите часовой пояс в формате IANA, например: `/%{cmd_list} tz Europe/Paris`.
  uk: >
    Часовий пояс кімнати: **%{tz}**. 
    Щоб змінити це, вкажіть часовий пояс у форматі IANA, наприклад: `/%{cmd_list} tz Europe/Paris`.
