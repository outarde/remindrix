name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    # tags: [ "v*" ]
    paths-ignore:
        - '**.md'
        - 'docs/**'
        - 'LICENSE'
        - '.gitignore'
        - '.dockerignore'
        - '**.env'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/deps/
            target/release/build/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install Zig and cargo-zigbuild
        run: |
          wget https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig-x86_64-linux-0.16.0.tar.xz
          sudo cp -r zig-x86_64-linux-0.16.0/* /usr/local/bin/
          cargo install cargo-zigbuild --force

      - name: Build for AMD64
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu

      - name: Build for ARM64
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      
      # to avoid .dockerignore for /target folder
      - name: Prepare artifacts for Docker
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-gnu/release/remindrix artifacts/bot-amd64
          cp target/aarch64-unknown-linux-gnu/release/remindrix artifacts/bot-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
